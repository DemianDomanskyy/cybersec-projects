services:
  - type: web
    name: ai-voice-guard
    runtime: python
    rootDir: tools/ai-voice-guard
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
